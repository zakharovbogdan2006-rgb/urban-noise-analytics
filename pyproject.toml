[project]
name = "noise-monitor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "paho-mqtt>=2.1,<3"
]

[project.optional-dependencies]
collector = ["numpy>=2.1,<3", "sounddevice>=0.5,<1"]
server = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3"
]
test = ["pytest>=8,<9", "numpy>=2.1,<3", "sounddevice>=0.5,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "collector"]

[tool.setuptools.package-data]
backend = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

