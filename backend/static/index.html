<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Noise Monitor</title>
  <style>
    :root{color-scheme:dark;--bg:#09111f;--card:#111c30;--accent:#36d399;--muted:#91a4c2}
    body{font:16px system-ui;margin:0;background:var(--bg);color:#eef4ff}.wrap{max-width:1100px;margin:auto;padding:28px}
    header{display:flex;justify-content:space-between;align-items:center}.status{color:var(--accent)}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);padding:20px;border-radius:14px}
    .value{font-size:2rem;font-weight:700}.label{color:var(--muted)}.chart{background:var(--card);border-radius:14px;margin-top:14px;padding:14px}.chart h2{font-size:1rem;color:var(--muted);margin:0 0 8px}canvas{width:100%;height:260px;display:block}
    @media(max-width:650px){.cards{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="wrap"><header><div><h1>Noise Monitor</h1><p class="label">Метрики микрофона в реальном времени</p></div><span id="status">подключение…</span></header>
<section class="cards"><div class="card"><div class="label">Уровень</div><div class="value" id="dbfs">— dBFS</div></div><div class="card"><div class="label">Пиковая частота</div><div class="value" id="freq">— Hz</div></div><div class="card"><div class="label">Устройство</div><div class="value" id="device">—</div></div></section>
<section class="chart"><h2>Уровень dBFS</h2><canvas id="level"></canvas></section><section class="chart"><h2>Энергия частотных диапазонов</h2><canvas id="bands"></canvas></section></main>
<script>
const keep=120, levels=[], bandValues=[0,0,0], levelCanvas=document.querySelector('#level'), bandCanvas=document.querySelector('#bands');
function context(canvas){const ratio=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==w*ratio||canvas.height!==h*ratio){canvas.width=w*ratio;canvas.height=h*ratio}const c=canvas.getContext('2d');c.setTransform(ratio,0,0,ratio,0,0);c.clearRect(0,0,w,h);return {c,w,h}}
function drawLevel(){const {c,w,h}=context(levelCanvas),pad=36;c.strokeStyle='#31415d';c.fillStyle='#91a4c2';c.font='12px system-ui';c.lineWidth=1;[-90,-60,-30,0].forEach(v=>{const y=pad+(0-v)*(h-2*pad)/90;c.beginPath();c.moveTo(pad,y);c.lineTo(w-8,y);c.stroke();c.fillText(v,4,y+4)});if(levels.length<2)return;c.strokeStyle='#36d399';c.lineWidth=2;c.beginPath();levels.forEach((v,i)=>{const x=pad+i*(w-pad-8)/(keep-1),y=pad+(0-Math.max(-90,Math.min(0,v)))*(h-2*pad)/90;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}
function drawBands(){const {c,w,h}=context(bandCanvas),names=['20–250 Hz','250–2000 Hz','2–20 kHz'],colors=['#60a5fa','#a78bfa','#fb7185'],gap=18,pad=34,bw=(w-pad*2-gap*2)/3;c.font='12px system-ui';bandValues.forEach((v,i)=>{const safe=Math.max(0,Math.min(1,v)),x=pad+i*(bw+gap),bh=safe*(h-65);c.fillStyle=colors[i];c.fillRect(x,h-35-bh,bw,bh);c.fillStyle='#eef4ff';c.textAlign='center';c.fillText((safe*100).toFixed(1)+'%',x+bw/2,h-42-bh);c.fillStyle='#91a4c2';c.fillText(names[i],x+bw/2,h-12)});c.textAlign='start'}
function add(m){levels.push(m.dbfs);if(levels.length>keep)levels.shift();bandValues.splice(0,3,m.low_energy,m.mid_energy,m.high_energy);drawLevel();drawBands();document.querySelector('#dbfs').textContent=m.dbfs.toFixed(1)+' dBFS';document.querySelector('#freq').textContent=m.peak_frequency_hz.toFixed(0)+' Hz';document.querySelector('#device').textContent=m.device_id}
addEventListener('resize',()=>{drawLevel();drawBands()});drawLevel();drawBands();
fetch('/api/v1/measurements?limit='+keep).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(xs=>xs.forEach(add)).catch(()=>document.querySelector('#status').textContent='ошибка REST API');
function connect(){const ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws/measurements');ws.onopen=()=>{document.querySelector('#status').textContent='● онлайн';document.querySelector('#status').className='status'};ws.onmessage=e=>add(JSON.parse(e.data));ws.onclose=()=>{document.querySelector('#status').textContent='переподключение…';setTimeout(connect,1500)}}connect();
</script></body></html>
